version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - corepack enable
        - corepack prepare pnpm@11.13.0 --activate
        - pnpm install --frozen-lockfile
    build:
      commands:
        # NEXT_PUBLIC_* values (form endpoint, Turnstile site key, Cloudinary name) are app environment
        # variables managed by Terraform; Next.js inlines them into the static export.
        - pnpm lint
        - pnpm build
  artifacts:
    # Static export (next.config.ts: output "export"). Hosted as platform WEB, no server.
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
