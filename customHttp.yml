# Response headers for every page. Replaces the caching and security rules of the old .htaccess.
# HSTS has no includeSubDomains on purpose: other subdomains (for example a staging subdomain on Hostinger) are hosted elsewhere.
customHeaders:
  - pattern: '**/*'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: X-Frame-Options
        value: SAMEORIGIN
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()
  # Hashed build assets never change; pages are always revalidated.
  - pattern: '/_next/static/**'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: '**/*.html'
    headers:
      - key: Cache-Control
        value: public, max-age=0, must-revalidate
